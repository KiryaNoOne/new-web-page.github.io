<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Моя страничка</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: white;
        }
        .card {
            background: rgba(255, 255, 255, 0.15);
            padding: 40px 60px;
            border-radius: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        h1 { margin: 0 0 10px; font-size: 2.5em; }
        p { margin: 0 0 20px; opacity: 0.9; }
        button {
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            background: white;
            color: #764ba2;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="card">
        <h1>Привет! 👋</h1>
        <p>Это моя первая страничка</p>
        <button onclick="alert('Спасибо за клик!')">Нажми меня</button>
    </div>
</body>
</html>
